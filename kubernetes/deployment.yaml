apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: devops-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: nginx-config
                  key: APP_ENV
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nginx-secret
                  key: DEMO_PASSWORD
